# Alembic configuration for Tracker.
#
# The database URL is normally resolved in alembic/env.py from the application
# settings (TRACKER_DATA_DIR / TRACKER_DATABASE_URL). Setting sqlalchemy.url
# here overrides that; `alembic -x db_url=...` overrides both.

[alembic]
script_location = alembic

# Makes `app` importable when alembic is invoked from backend/.
prepend_sys_path = .

# Date-prefixed revision files keep the versions directory readable in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Empty on purpose: see alembic/env.py.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
